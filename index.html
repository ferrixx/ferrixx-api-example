<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ferrixx API – Auth Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Auth card ─────────────────────────────────────────────────── -->
<div class="card" id="authCard">
  <div class="card-header">
    <h1><span class="logo">⚡</span> ferrixx API Demo</h1>
    <div style="font-size:.8rem;color:var(--muted);margin-top:4px">User Auth via Custom Collections</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab"        onclick="switchTab('register')">Register</button>
    </div>
  </div>

  <div class="card-body">
    <div class="alert alert-error"   id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>

    <!-- Login form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="loginBtn" type="submit">Login</button>
    </form>

    <!-- Register form -->
    <form id="registerForm" onsubmit="handleRegister(event)" style="display:none">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUsername" placeholder="alice" required minlength="3"
               pattern="[a-z0-9_]+" title="Lowercase letters, digits and underscores only">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="alice@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Choose a strong password" required minlength="6" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" id="registerBtn" type="submit">Create account</button>
    </form>
  </div>

  <div class="footer-note">
    Powered by <a href="https://api.ferrixx.de" target="_blank">ferrixx API</a> Custom Collections
  </div>
</div>

<!-- ── Dashboard ──────────────────────────────────────────────── -->
<div class="app-layout" id="appLayout" style="display:none">

  <!-- Left: user card -->
  <div class="card" style="width:280px;flex-shrink:0;align-self:flex-start">
    <div class="card-header" style="text-align:center;padding-bottom:20px">
      <div class="dash-avatar" id="dashAvatar"></div>
      <div class="dash-name"  id="dashName"></div>
      <div class="dash-email" id="dashEmail"></div>
    </div>
    <div class="card-body" style="padding:16px 20px">
      <div class="info-row">
        <span class="info-label">User ID</span>
        <span class="info-value" id="dashId"></span>
      </div>
      <div class="info-row">
        <span class="info-label">Registered</span>
        <span class="info-value" id="dashCreated"></span>
      </div>

      <!-- Uptime widget -->
      <div style="margin-top:16px;padding:12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)">
        <div style="font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">
          🟢 API Status
        </div>
        <div class="info-row" style="padding:4px 0;border:none">
          <span class="info-label">Uptime</span>
          <span class="info-value" id="dashUptime" style="color:var(--green)">...</span>
        </div>
        <div class="info-row" style="padding:4px 0;border:none">
          <span class="info-label">Servers</span>
          <span class="info-value" id="dashServers">...</span>
        </div>
        <div class="info-row" style="padding:4px 0;border:none">
          <span class="info-label">Version</span>
          <span class="info-value" id="dashVersion">...</span>
        </div>
      </div>
    </div>
    <div style="padding:16px 20px;border-top:1px solid var(--border)">
      <button class="btn btn-danger" onclick="logout()" style="margin-top:0;font-size:.85rem;padding:8px">Logout</button>
    </div>
    <div class="footer-note">Powered by <a href="https://api.ferrixx.de" target="_blank">ferrixx API</a></div>
  </div>

  <!-- Right: posts -->
  <div style="flex:1;min-width:0">

    <!-- New post form -->
    <div class="card" style="max-width:none;margin-bottom:16px">
      <div class="card-header">
        <h1 style="font-size:.95rem">✏️ New Post</h1>
      </div>
      <div class="card-body" style="padding:16px 20px">
        <div class="alert alert-error" id="postError"></div>
        <form id="newPostForm" onsubmit="handleNewPost(event)">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="postTitle" placeholder="What's on your mind?" required maxlength="200">
          </div>
          <div class="form-group" style="margin-bottom:8px">
            <label>Content</label>
            <textarea id="postContent" rows="3" required placeholder="Write something..."
              style="width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;outline:none;resize:vertical;font-family:inherit"></textarea>
          </div>
          <button class="btn btn-primary" id="postBtn" type="submit" style="width:auto;padding:8px 20px;font-size:.85rem;margin-top:0">Post</button>
        </form>
      </div>
    </div>

    <!-- Posts feed -->
    <div class="card" style="max-width:none">
      <div class="card-header d-flex" style="justify-content:space-between;align-items:center">
        <h1 style="font-size:.95rem">📰 Posts</h1>
        <button onclick="loadPosts()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem">↻ Refresh</button>
      </div>
      <div id="postsFeed" style="padding:8px 0">
        <div style="text-align:center;padding:32px;color:var(--muted);font-size:.85rem">Loading posts...</div>
      </div>
    </div>

  </div>
</div>

<script src="api_script.js"></script>
</body>
</html>
